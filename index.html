<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Our Anniversary 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
    radial-gradient(
        circle at center,
        #3b2f25,
        #3b2f25,
        #534335
    );

    color: #DBDBDC;

    display: flex;

    justify-content: center;

    align-items: center;
}

.container {

    width: 100%;

    max-width: 500px;

    padding: 25px 20px;

    text-align: center;
}

.hearts {

    font-size: 35px;

    margin-bottom: 10px;
}

h1 {

    color: #363657;

    font-size: 34px;

    margin: 5px 0;
    text-shadow:
        0 0 2px #FFFFFF,
        0 0 5px #C0C0C0,
        0 0 10px #D9D9D9;
}

.subtitle {

    font-size: 16px;

    line-height: 1.5;

    margin-bottom: 25px;
}

.card {

    background: #EDDFDB;
    opacity: 0.9;

    border-radius: 25px;

    padding: 20px;

    margin: 14px 0;

    box-shadow:
        0 8px 25px
        rgba(120,50,80,0.12);

    transition:
        transform 0.15s;
}

.card:active {

    transform: scale(0.96);
}

.game-button {

    width: 100%;

    border: none;

    background: transparent;
/**
   color: #71394f;
     **/
color : #4A4D4A;
    font-size: 18px;

    font-weight: bold;

    padding: 5px;
}

.icon {

    font-size: 45px;

    display: block;

    margin-bottom: 8px;
}

.description {

    font-size: 14px;

    font-weight: normal;

    color: #954535;

    margin-top: 5px;
}

.message {

    margin-top: 25px;

    font-size: 15px;

    color: #F0B9BD;

    line-height: 1.6;
}

</style>

</head>


<body>


<div class="container">


    <div class="hearts">
         ❤️🐼🐻♥️
    </div>


    <h1>
        Our 1st Anniversary 
       S♥️A
    </h1>


    <div class="subtitle">

        A little collection of games
        made just for you 🥰 I hope you like them

    </div>


    <!-- MAZE -->

    <div
        class="card"
        onclick="openGame('maze.html')"
    >

        <button class="game-button">

            <span class="icon">
                🧩
            </span>

            Love Maze

            <div class="description">

                Find your way to my heart ❤️

            </div>

        </button>

    </div>


    <!-- FIGHT -->

    <div
        class="card"
        onclick="openGame('fight.html')"
    >

        <button class="game-button">

            <span class="icon">
                🥊
            </span>

            Love Battle

            <div class="description">

                Fight your way to victory! 💕


            </div>

        </button>

    </div>


    <!-- GOAL -->

    <div
        class="card"
        onclick="openGame('goal.html')"
    >

        <button class="game-button">

            <span class="icon">
                ⚽
            </span>

            Score for Love

            <div class="description">

                You have 3 tries to score! 🥅

            </div>

        </button>

    </div>


    <div class="message">

        Made with love, just for you. ❤️

        <br>

        Happy 1st Anniversary! 🥹💕

    </div>


</div>


<script>

function openGame(game) {

    window.location.href = game;

}

</script>


</body>

</html>
