<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love Battle 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffe0eb,
            #fff2f7,
            #ffd5e5
        );

    color: #71394f;

    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 500px;

    padding: 30px 18px;

    text-align: center;
}

h1 {
    color: #d94f7a;
    font-size: 34px;
}

.subtitle {
    margin-bottom: 25px;
}

.fighters {
    display: flex;
    justify-content: space-around;
    align-items: center;

    margin: 25px 0;
}

.fighter {
    font-size: 65px;
}

.vs {
    font-size: 25px;
    font-weight: bold;
    color: #d94f7a;
}

.health-box {
    margin: 15px 0;
}

.name {
    font-weight: bold;
    margin-bottom: 5px;
}

.health {
    width: 100%;
    height: 18px;

    background: #ffffff;

    border-radius: 20px;

    overflow: hidden;
}

.health-fill {
    height: 100%;

    width: 100%;

    background: #e95b88;

    transition: width 0.3s ease;
}

.buttons {
    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 25px;
}

button {
    border: none;

    border-radius: 20px;

    padding: 15px;

    font-size: 17px;

    font-weight: bold;

    background: #e95b88;

    color: white;

    box-shadow:
        0 5px 12px
        rgba(120,50,80,0.12);
}

button:active {
    transform: scale(0.96);
}

#battleMessage {
    min-height: 45px;

    margin-top: 20px;

    font-weight: bold;
}

#result {
    display: none;

    background: white;

    padding: 25px;

    border-radius: 25px;

    margin-top: 20px;

    box-shadow:
        0 10px 30px
        rgba(120,50,80,0.15);
}

.resultEmoji {
    font-size: 60px;
}

.resultTitle {
    color: #d94f7a;
    font-size: 28px;
}

.restart {
    margin-top: 15px;
}

</style>
</head>

<body>

<div class="game">

    <h1>🥊 Love Battle 💕</h1>

    <div class="subtitle">
        Fight your way to victory! 😈
    </div>

    <div class="fighters">

        <div>
            <div class="fighter">💗</div>
            <div>You</div>
        </div>

        <div class="vs">VS</div>

        <div>
            <div class="fighter">😈</div>
            <div>Opponent</div>
        </div>

    </div>


    <!-- PLAYER HEALTH -->

    <div class="health-box">

        <div class="name">
            Your Health: <span id="playerHealthText">100</span>
        </div>

        <div class="health">

            <div
                class="health-fill"
                id="playerHealth">
            </div>

        </div>

    </div>


    <!-- COMPUTER HEALTH -->

    <div class="health-box">

        <div class="name">
            Opponent Health:
            <span id="enemyHealthText">100</span>
        </div>

        <div class="health">

            <div
                class="health-fill"
                id="enemyHealth">
            </div>

        </div>

    </div>


    <div id="battleMessage">
        Choose your move! 💕
    </div>


    <div class="buttons">

        <button onclick="attack()">
            👊 Attack
        </button>

        <button onclick="heavyAttack()">
            💥 Heavy Attack
        </button>

        <button onclick="heal()">
            💖 Heal
        </button>

    </div>


    <div id="result">

        <div
            class="resultEmoji"
            id="resultEmoji">
        </div>

        <div
            class="resultTitle"
            id="resultTitle">
        </div>

        <p id="resultMessage"></p>

        <button
            class="restart"
            onclick="restartGame()">

            🔄 Fight Again

        </button>

    </div>

</div>


<script>

let playerHealth = 100;

let enemyHealth = 200;

let gameOver = false;


const playerHealthBar =
    document.getElementById(
        "playerHealth"
    );

const enemyHealthBar =
    document.getElementById(
        "enemyHealth"
    );

const playerHealthText =
    document.getElementById(
        "playerHealthText"
    );

const enemyHealthText =
    document.getElementById(
        "enemyHealthText"
    );

const battleMessage =
    document.getElementById(
        "battleMessage"
    );


function updateHealth() {

    playerHealthBar.style.width =
        playerHealth + "%";

    enemyHealthBar.style.width =
        enemyHealth + "%";

    playerHealthText.textContent =
        playerHealth;

    enemyHealthText.textContent =
        enemyHealth;

}


function enemyAttack() {

    if (gameOver) return;

    const damage =
        Math.floor(
            Math.random() * 11
        ) + 12;

    playerHealth -= damage;

    if (playerHealth < 0) {
        playerHealth = 0;
    }

    updateHealth();

    battleMessage.textContent =
        "😈 Your opponent attacked you for "
        + damage +
        " damage!";


    checkWinner();

}


function attack() {

    if (gameOver) return;

    const damage =
        Math.floor(
            Math.random() * 8
        ) + 5;

    enemyHealth -= damage;

    if (enemyHealth < 0) {
        enemyHealth = 0;
    }

    updateHealth();

    battleMessage.textContent =
        "👊 You attacked for "
        + damage +
        " damage!";

    if (!checkWinner()) {

        setTimeout(
            enemyAttack,
            600
        );

    }

}


function heavyAttack() {

    if (gameOver) return;

    const damage =
        Math.floor(
            Math.random() * 26
        ) + 15;

    enemyHealth -= damage;

    if (enemyHealth < 0) {
        enemyHealth = 0;
    }

    updateHealth();

    battleMessage.textContent =
        "💥 BOOM! Heavy attack did "
        + damage +
        " damage!";

    if (!checkWinner()) {

        setTimeout(
            enemyAttack,
            600
        );

    }

}


function heal() {

    if (gameOver) return;

    const healing =
        Math.floor(
            Math.random() * 16
        ) + 10;

    playerHealth += healing;

    if (playerHealth > 100) {
        playerHealth = 100;
    }

    updateHealth();

    battleMessage.textContent =
        "💖 You healed yourself!";


    setTimeout(
        enemyAttack,
        600
    );

}


function checkWinner() {

    if (enemyHealth <= 0) {

        endGame(true);

        return true;

    }


    if (playerHealth <= 0) {

        endGame(false);

        return true;

    }

    return false;

}


function endGame(playerWon) {

    gameOver = true;


    document.getElementById(
        "result"
    ).style.display = "block";


    if (playerWon) {

        document.getElementById(
            "resultEmoji"
        ).textContent = "🏆❤️";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "YOU WON!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "You fought your way to victory! 🥹💕 "
            +
            "No matter what happens, you're always "
            +
            "my favorite winner. Happy Anniversary! ❤️";

    }

    else {

        document.getElementById(
            "resultEmoji"
        ).textContent = "😭💔";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "You Lost!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "Awww, you lost this round! 😭💕 "
            +
            "But don't worry... I'll still love you "
            +
            "even when you lose. ❤️";

    }

}


function restartGame() {

    playerHealth = 100;

    enemyHealth = 100;

    gameOver = false;

    document.getElementById(
        "result"
    ).style.display = "none";

    battleMessage.textContent =
        "Choose your move! 💕";

    updateHealth();

}

updateHealth();

</script>

</body>
</html>
