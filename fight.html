<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love Battle 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffdce9,
            #fff1f6,
            #ffd2e2
        );

    color: #71394f;

    display: flex;
    justify-content: center;
}

.game {

    width: 100%;
    max-width: 500px;

    padding:
        25px 18px
        35px;

    text-align: center;
}


/* =========================
   BACK TO MENU
========================= */

.menu-button {

    display: inline-block;

    margin-bottom: 12px;

    padding: 10px 18px;

    background: white;

    color: #d94f7a;

    text-decoration: none;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(120,50,80,0.12);
}

.menu-button:active {

    transform: scale(0.95);

}


/* =========================
   TITLE
========================= */

h1 {

    color: #d94f7a;

    font-size: 32px;

    margin: 8px 0 5px;
}

.subtitle {

    margin-bottom: 20px;

    font-size: 15px;
}


/* =========================
   FIGHTERS
========================= */

.fighters {

    display: flex;

    justify-content:
        space-around;

    align-items: center;

    margin: 20px 0;
}

.fighter {

    font-size: 65px;

    transition:
        transform 0.2s;
}

.fighter.hit {

    transform:
        translateX(8px)
        rotate(5deg);
}

.vs {

    font-weight: bold;

    font-size: 22px;

    color: #d94f7a;
}


/* =========================
   HEALTH
========================= */

.health-box {

    margin: 13px 0;
}

.name {

    font-size: 14px;

    font-weight: bold;

    margin-bottom: 5px;
}

.health {

    width: 100%;

    height: 18px;

    background: white;

    border-radius: 20px;

    overflow: hidden;
}

.health-fill {

    height: 100%;

    width: 100%;

    background: #e95b88;

    transition:
        width 0.35s ease;
}

.enemy-bar {

    background: #9b78d4;
}


/* =========================
   BATTLE MESSAGE
========================= */

#battleMessage {

    min-height: 45px;

    margin: 18px 5px;

    font-size: 15px;

    font-weight: bold;

    line-height: 1.4;
}


/* =========================
   MOVES
========================= */

.moves {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 10px;

    margin-top: 15px;
}

.move {

    border: none;

    border-radius: 18px;

    padding: 15px 8px;

    background: white;

    color: #71394f;

    font-size: 15px;

    font-weight: bold;

    box-shadow:
        0 5px 14px
        rgba(120,50,80,0.12);
}

.move:active {

    transform: scale(0.95);
}

.move small {

    display: block;

    margin-top: 4px;

    font-size: 11px;

    font-weight: normal;

    color: #a16b80;
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 15px;

    padding: 10px;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.65);

    font-size: 13px;
}


/* =========================
   RESULT
========================= */

#result {

    display: none;

    background: white;

    border-radius: 25px;

    padding: 28px 20px;

    margin-top: 20px;

    box-shadow:
        0 10px 30px
        rgba(120,50,80,0.15);

    animation:
        appear 0.5s ease;
}

.resultEmoji {

    font-size: 60px;
}

.resultTitle {

    color: #d94f7a;

    font-size: 29px;
}

.resultMessage {

    font-size: 16px;

    line-height: 1.7;
}

.restart {

    margin-top: 15px;

    padding: 13px 25px;

    border: none;

    border-radius: 25px;

    background: #e95b88;

    color: white;

    font-size: 16px;

    font-weight: bold;
}

.restart:active {

    transform: scale(0.95);
}


/* =========================
   ANIMATION
========================= */

@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}

</style>

</head>


<body>


<div class="game">


<!-- BACK TO MENU -->

<a
    href="index.html"
    class="menu-button">

    🏠 Back to Menu

</a>


<h1>
    🥊 Love Battle 💕
</h1>


<div class="subtitle">

    Choose your moves wisely...
    😈

</div>


<!-- FIGHTERS -->

<div class="fighters">

    <div>

        <div
            class="fighter"
            id="playerEmoji">

            💗

        </div>

        <strong>
            You
        </strong>

    </div>


    <div class="vs">
        VS
    </div>


    <div>

        <div
            class="fighter"
            id="enemyEmoji">

            😈

        </div>

        <strong>
            Opponent
        </strong>

    </div>

</div>


<!-- PLAYER HEALTH -->

<div class="health-box">

    <div class="name">

        ❤️ Your Health:
        <span id="playerHealthText">
            100
        </span>

    </div>

    <div class="health">

        <div
            class="health-fill"
            id="playerHealth">
        </div>

    </div>

</div>


<!-- ENEMY HEALTH -->

<div class="health-box">

    <div class="name">

        😈 Opponent Health:
        <span id="enemyHealthText">
            120
        </span>

    </div>

    <div class="health">

        <div
            class="health-fill enemy-bar"
            id="enemyHealth">
        </div>

    </div>

</div>


<!-- MESSAGE -->

<div id="battleMessage">

    Choose your move! 💕

</div>


<!-- MOVES -->

<div class="moves">


    <button
        class="move"
        onclick="attack()">

        👊 Attack

        <small>
            Reliable damage
        </small>

    </button>


    <button
        class="move"
        onclick="heavyAttack()">

        💥 Heavy Attack

        <small>
            Powerful, but risky
        </small>

    </button>


    <button
        class="move"
        onclick="heal()">

        💖 Heal

        <small>
            3 uses left:
            <span id="healCount">
                3
            </span>
        </small>

    </button>


    <button
        class="move"
        onclick="block()">

        🛡️ Block

        <small>
            Reduce next attack
        </small>

    </button>


</div>


<div class="status">

    🛡️ Block status:
    <span id="blockStatus">
        Not active
    </span>

</div>


<!-- RESULT -->

<div id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
    </div>


    <h2
        class="resultTitle"
        id="resultTitle">
    </h2>


    <p
        class="resultMessage"
        id="resultMessage">
    </p>


    <button
        class="restart"
        onclick="restartGame()">

        🔄 Fight Again

    </button>

</div>


</div>


<script>


/* =========================
   GAME VARIABLES
========================= */

let playerHealth = 100;

let enemyHealth = 120;

let healUses = 3;

let blocking = false;

let gameOver = false;

let playerTurn = true;


/* =========================
   ELEMENTS
========================= */

const playerHealthBar =
    document.getElementById(
        "playerHealth"
    );

const enemyHealthBar =
    document.getElementById(
        "enemyHealth"
    );

const playerHealthText =
    document.getElementById(
        "playerHealthText"
    );

const enemyHealthText =
    document.getElementById(
        "enemyHealthText"
    );

const battleMessage =
    document.getElementById(
        "battleMessage"
    );

const healCount =
    document.getElementById(
        "healCount"
    );

const blockStatus =
    document.getElementById(
        "blockStatus"
    );


/* =========================
   UPDATE HEALTH
========================= */

function updateHealth() {

    playerHealthBar.style.width =
        playerHealth + "%";

    enemyHealthBar.style.width =
        (enemyHealth / 120 * 100)
        + "%";


    playerHealthText.textContent =
        playerHealth;

    enemyHealthText.textContent =
        enemyHealth;

    healCount.textContent =
        healUses;

}


/* =========================
   RANDOM NUMBER
========================= */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================
   DISABLE MOVES
========================= */

function disableMoves() {

    document.querySelectorAll(
        ".move"
    ).forEach(button => {

        button.disabled = true;

        button.style.opacity =
            "0.5";

    });

}


/* =========================
   ENABLE MOVES
========================= */

function enableMoves() {

    document.querySelectorAll(
        ".move"
    ).forEach(button => {

        button.disabled = false;

        button.style.opacity =
            "1";

    });


    if (healUses <= 0) {

        document.querySelectorAll(
            ".move"
        )[2].disabled = true;

        document.querySelectorAll(
            ".move"
        )[2].style.opacity =
            "0.4";

    }

}


/* =========================
   PLAYER ATTACK
========================= */

function attack() {

    if (
        gameOver ||
        !playerTurn
    ) return;


    playerTurn = false;

    disableMoves();


    let damage =
        random(8, 15);


    /*
       12% critical chance
    */

    if (
        Math.random() < 0.12
    ) {

        damage *= 2;

        battleMessage.textContent =
            "💥 CRITICAL HIT! "
            + damage +
            " damage!";

    }

    else {

        battleMessage.textContent =
            "👊 You dealt "
            + damage +
            " damage!";

    }


    /*
       Enemy has 15% block chance
    */

    if (
        Math.random() < 0.15
    ) {

        damage =
            Math.floor(
                damage * 0.4
            );

        battleMessage.textContent =
            "🛡️ They blocked your attack! "
            + damage +
            " damage.";

    }


    enemyHealth -= damage;


    if (enemyHealth < 0) {

        enemyHealth = 0;

    }


    updateHealth();


    if (
        checkWinner()
    ) return;


    setTimeout(
        enemyTurn,
        700
    );

}


/* =========================
   HEAVY ATTACK
========================= */

function heavyAttack() {

    if (
        gameOver ||
        !playerTurn
    ) return;


    playerTurn = false;

    disableMoves();


    /*
       25% chance to miss
    */

    if (
        Math.random() < 0.25
    ) {

        battleMessage.textContent =
            "😭 Your heavy attack MISSED!";

        setTimeout(
            enemyTurn,
            700
        );

        return;

    }


    let damage =
        random(16, 27);


    /*
       Critical chance
    */

    if (
        Math.random() < 0.10
    ) {

        damage *= 2;

        battleMessage.textContent =
            "💥💥 MASSIVE CRITICAL HIT!";

    }

    else {

        battleMessage.textContent =
            "💥 Heavy attack! "
            + damage +
            " damage!";

    }


    /*
       Enemy block
    */

    if (
        Math.random() < 0.20
    ) {

        damage =
            Math.floor(
                damage * 0.4
            );

        battleMessage.textContent =
            "🛡️ They blocked most of it!";

    }


    enemyHealth -= damage;


    if (enemyHealth < 0) {

        enemyHealth = 0;

    }


    updateHealth();


    if (
        checkWinner()
    ) return;


    setTimeout(
        enemyTurn,
        700
    );

}


/* =========================
   HEAL
========================= */

function heal() {

    if (
        gameOver ||
        !playerTurn ||
        healUses <= 0
    ) return;


    playerTurn = false;

    disableMoves();


    const amount =
        random(8, 15);


    playerHealth += amount;


    if (
        playerHealth > 100
    ) {

        playerHealth = 100;

    }


    healUses--;


    battleMessage.textContent =
        "💖 You healed "
        + amount +
        " HP!";


    updateHealth();


    setTimeout(
        enemyTurn,
        700
    );

}


/* =========================
   BLOCK
========================= */

function block() {

    if (
        gameOver ||
        !playerTurn
    ) return;


    playerTurn = false;

    disableMoves();


    blocking = true;


    blockStatus.textContent =
        "🛡️ ACTIVE";


    battleMessage.textContent =
        "🛡️ You are blocking!";


    setTimeout(
        enemyTurn,
        700
    );

}


/* =========================
   ENEMY TURN
========================= */

function enemyTurn() {

    if (gameOver) return;


    let damage;


    /*
       Enemy becomes stronger
       when health is low
    */

    if (
        enemyHealth <= 45
    ) {

        damage =
            random(16, 25);

    }

    else {

        damage =
            random(12, 21);

    }


    /*
       Small chance enemy
       performs a powerful hit
    */

    if (
        Math.random() < 0.15
    ) {

        damage += random(
            5,
            10
        );

        battleMessage.textContent =
            "😈 Your opponent used "
            +
            "a POWERFUL attack!";

    }


    /*
       Apply block
    */

    if (blocking) {

        damage =
            Math.floor(
                damage * 0.35
            );

        blocking = false;


        blockStatus.textContent =
            "Not active";


        battleMessage.textContent =
            "🛡️ Your block protected you! "
            +
            damage +
            " damage.";

    }

    else {

        battleMessage.textContent =
            "😈 Opponent attacked for "
            +
            damage +
            " damage!";

    }


    playerHealth -= damage;


    if (
        playerHealth < 0
    ) {

        playerHealth = 0;

    }


    updateHealth();


    if (
        checkWinner()
    ) return;


    playerTurn = true;

    enableMoves();

}


/* =========================
   CHECK WINNER
========================= */

function checkWinner() {

    if (
        enemyHealth <= 0
    ) {

        endGame(true);

        return true;

    }


    if (
        playerHealth <= 0
    ) {

        endGame(false);

        return true;

    }


    return false;

}


/* =========================
   END GAME
========================= */

function endGame(playerWon) {

    gameOver = true;

    disableMoves();


    document.getElementById(
        "result"
    ).style.display =
        "block";


    if (playerWon) {

        document.getElementById(
            "resultEmoji"
        ).textContent =
            "🏆❤️";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "YOU WON!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "You actually did it! 😭❤️ "
            +
            "You fought your way to victory "
            +
            "and proved you're stronger than "
            +
            "you look. 😂💕 "
            +
            "Happy Anniversary, my love!";

    }

    else {

        document.getElementById(
            "resultEmoji"
        ).textContent =
            "😭💔";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "YOU LOST!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "Awww... you lost this one. 😭💕 "
            +
            "Maybe you should have blocked "
            +
            "instead of attacking so much! 😂 "
            +
            "But don't worry, I still love you "
            +
            "even when you lose. ❤️";

    }


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   RESTART
========================= */

function restartGame() {

    playerHealth = 100;

    enemyHealth = 120;

    healUses = 3;

    blocking = false;

    gameOver = false;

    playerTurn = true;


    document.getElementById(
        "result"
    ).style.display =
        "none";


    blockStatus.textContent =
        "Not active";


    battleMessage.textContent =
        "Choose your move! 💕";


    updateHealth();

    enableMoves();

}


updateHealth();

</script>

</body>

</html>
