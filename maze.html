<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love Maze 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        radial-gradient(circle at center, #ffe4c4, #f5deb3, #bc8f8f)
        );

    color: #4a4540;

    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 520px;

    padding:
        18px 14px
        35px;

    text-align: center;
}


/* =========================
   BACK TO MENU
========================= */

.menu-button {
    display: inline-block;

    margin-bottom: 8px;

    padding: 9px 17px;

    background: #8b6c5c;

    color: #293845;

    text-decoration: none;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(100,50,90,0.12);
}

.menu-button:active {
    transform: scale(0.95);
}


/* =========================
   TITLE
========================= */

h1 {
    color: #b94f7b;

    font-size: 30px;

    margin: 7px 0 4px;
}

.subtitle {
    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 14px;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;

    justify-content:
        space-around;

    background: white;

    border-radius: 18px;

    padding: 11px;

    margin-bottom: 14px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(100,50,90,0.08);
}

.warning {
    color: #c94d68;
}


/* =========================
   MAZE
========================= */

#maze {
    width: min(94vw, 455px);

    height: min(94vw, 455px);

    margin: auto;

    display: grid;

    background: #fff;

    border:
        4px solid #342214;

    border-radius: 14px;

    overflow: hidden;

    touch-action: none;

    box-shadow:
        0 9px 25px
        rgba(100,50,90,0.18);
}


/* =========================
   CELLS
========================= */

.cell {
    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #fff9fc;
}

.wall {
    background:
        #c98cab !important;
}


/* =========================
   PLAYER
========================= */

.player {
    width: 72%;
    height: 72%;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #f58db2;

    font-size:
        clamp(14px, 5vw, 27px);

    z-index: 3;

    box-shadow:
        0 3px 7px
        rgba(100,50,90,0.25);

    transition:
        transform 0.1s ease;
}


/* =========================
   GOAL
========================= */

.goal {
    font-size:
        clamp(17px, 6vw, 30px);

    animation:
        pulse 1.2s infinite;
}

@keyframes pulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}


/* =========================
   MESSAGE
========================= */

#message {
    min-height: 42px;

    margin: 13px 5px;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.5;
}


/* =========================
   CONTROLS
========================= */

.controls {
    width: 190px;

    margin:
        8px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.control {
    width: 58px;
    height: 50px;

    border: none;

    border-radius: 16px;

    background: white;

    color: #b94f7b;

    font-size: 21px;

    font-weight: bold;

    box-shadow:
        0 4px 10px
        rgba(100,50,90,0.12);
}

.control:active {
    transform: scale(0.91);
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}


/* =========================
   BUTTONS
========================= */

.new-maze {
    margin-top: 13px;

    padding: 12px 21px;

    border: none;

    border-radius: 22px;

    background: #bd5d85;

    color: white;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 5px 12px
        rgba(100,50,90,0.15);
}

.new-maze:active {
    transform: scale(0.95);
}


/* =========================
   RESULT
========================= */

#result {
    display: none;

    background: white;

    border-radius: 25px;

    padding: 25px 18px;

    margin-top: 18px;

    box-shadow:
        0 10px 30px
        rgba(100,50,90,0.15);
}

.resultEmoji {
    font-size: 58px;
}

.resultTitle {
    color: #b94f7b;

    font-size: 27px;
}

.resultMessage {
    font-size: 15px;

    line-height: 1.7;
}

.play-again {
    padding: 13px 22px;

    border: none;

    border-radius: 22px;

    background: #bd5d85;

    color: white;

    font-size: 15px;

    font-weight: bold;
}

.play-again:active {
    transform: scale(0.95);
}

</style>

</head>


<body>


<div class="game">


<a
    href="index.html"
    class="menu-button">

    🏠 Back to Menu

</a>


<h1>
    🧩 Love Maze 💕
</h1>


<div class="subtitle">

    Find your way to my heart
    before time runs out. 😈❤️

    <br>

    <small>
        Every game creates a new maze.
    </small>

</div>


<div class="stats">

    <div>

        ⏱️ Time:
        <span id="timer">
            90
        </span>s

    </div>


    <div>

        👣 Moves:
        <span id="moves">
            0
        </span>

    </div>

</div>


<div id="maze"></div>


<div id="message">

    Swipe or use the arrows
    to find the ❤️!

</div>


<div class="controls">


    <button
        class="control up"
        onclick="move(0,-1)">

        ⬆️

    </button>


    <button
        class="control left"
        onclick="move(-1,0)">

        ⬅️

    </button>


    <button
        class="control down"
        onclick="move(0,1)">

        ⬇️

    </button>


    <button
        class="control right"
        onclick="move(1,0)">

        ➡️

    </button>


</div>


<button
    class="new-maze"
    onclick="newMaze()">

    🔄 New Maze

</button>


<div id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
    </div>


    <h2
        class="resultTitle"
        id="resultTitle">
    </h2>


    <p
        class="resultMessage"
        id="resultMessage">
    </p>


    <button
        class="play-again"
        onclick="newMaze()">

        🧩 Try Another Maze

    </button>

</div>


</div>


<script>


/* =========================
   GAME SETTINGS
========================= */


/*
   15 x 15 makes the maze
   noticeably harder.

   Because the maze uses
   odd dimensions, the
   generator can create
   proper corridors.
*/

const SIZE = 15;


/*
   90 seconds gives an adult
   enough time to think but
   prevents taking forever.
*/

const TIME_LIMIT = 90;


let maze = [];

let player = {
    x: 1,
    y: 1
};

let goal = {
    x: SIZE - 2,
    y: SIZE - 2
};

let moves = 0;

let timeLeft = TIME_LIMIT;

let timer;

let gameOver = false;


/* =========================
   RANDOM NUMBER
========================= */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================
   CREATE EMPTY MAZE
========================= */

function createEmptyMaze() {

    maze = [];

    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        maze[y] = [];

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            maze[y][x] = 1;

        }

    }

}


/* =========================
   GENERATE MAZE
========================= */

function generateMaze() {

    createEmptyMaze();


    /*
       Recursive backtracking.

       This creates a maze where
       the player always has a
       legitimate path to the end.
    */

    function carve(x, y) {

        maze[y][x] = 0;


        let directions = [

            [2, 0],

            [-2, 0],

            [0, 2],

            [0, -2]

        ];


        shuffle(directions);


        for (
            const [dx, dy]
            of directions
        ) {

            const nx = x + dx;

            const ny = y + dy;


            if (
                nx > 0 &&
                nx < SIZE - 1 &&
                ny > 0 &&
                ny < SIZE - 1 &&
                maze[ny][nx] === 1
            ) {

                maze[
                    y + dy / 2
                ][
                    x + dx / 2
                ] = 0;


                carve(nx, ny);

            }

        }

    }


    carve(1, 1);


    player = {
        x: 1,
        y: 1
    };


    goal = {
        x: SIZE - 2,
        y: SIZE - 2
    };


    maze[
        goal.y
    ][
        goal.x
    ] = 0;


    /*
       Add a few extra openings.

       This creates alternate routes
       and prevents every maze from
       feeling exactly the same.
    */

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const x =
            random(1, SIZE - 2);

        const y =
            random(1, SIZE - 2);


        if (
            x % 2 === 1 ||
            y % 2 === 1
        ) {

            maze[y][x] = 0;

        }

    }

}


/* =========================
   DRAW MAZE
========================= */

function drawMaze() {

    const mazeElement =
        document.getElementById(
            "maze"
        );


    mazeElement.innerHTML = "";


    mazeElement.style.gridTemplateColumns =
        `repeat(${SIZE}, 1fr)`;


    mazeElement.style.gridTemplateRows =
        `repeat(${SIZE}, 1fr)`;


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            /*
               Wall
            */

            if (
                maze[y][x] === 1
            ) {

                cell.classList.add(
                    "wall"
                );

            }


            /*
               Player
            */

            if (
                x === player.x &&
                y === player.y
            ) {

                const playerElement =
                    document.createElement(
                        "div"
                    );

                playerElement.className =
                    "player";

                playerElement.textContent =
                    "💗";

                cell.appendChild(
                    playerElement
                );

            }


            /*
               Goal
            */

            if (
                x === goal.x &&
                y === goal.y
            ) {

                const goalElement =
                    document.createElement(
                        "div"
                    );

                goalElement.className =
                    "goal";

                goalElement.textContent =
                    "❤️";

                cell.appendChild(
                    goalElement
                );

            }


            mazeElement.appendChild(
                cell
            );

        }

    }

}


/* =========================
   MOVE PLAYER
========================= */

function move(dx, dy) {

    if (gameOver) return;


    const newX =
        player.x + dx;

    const newY =
        player.y + dy;


    /*
       Don't allow moving
       outside the maze.
    */

    if (
        newX < 0 ||
        newX >= SIZE ||
        newY < 0 ||
        newY >= SIZE
    ) {

        return;

    }


    /*
       Wall collision.
    */

    if (
        maze[newY][newX] === 1
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "💥 Dead end! Try another path.";

        return;

    }


    /*
       Move.
    */

    player.x = newX;

    player.y = newY;

    moves++;


    document.getElementById(
        "moves"
    ).textContent =
        moves;


    drawMaze();


    /*
       Check if player reached
       the heart.
    */

    if (
        player.x === goal.x &&
        player.y === goal.y
    ) {

        winGame();

    }

}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timer);


    timer = setInterval(
        function() {

            if (gameOver) return;


            timeLeft--;


            document.getElementById(
                "timer"
            ).textContent =
                timeLeft;


            /*
               Make timer red
               during final 15 seconds.
            */

            if (
                timeLeft <= 15
            ) {

                document.getElementById(
                    "timer"
                ).classList.add(
                    "warning"
                );

            }


            if (
                timeLeft <= 0
            ) {

                loseGame();

            }

        },
        1000
    );

}


/* =========================
   WIN GAME
========================= */

function winGame() {

    if (gameOver) return;


    gameOver = true;

    clearInterval(timer);


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "resultEmoji"
    ).textContent =
        "🥹💕";


    document.getElementById(
        "resultTitle"
    ).textContent =
        "YOU FOUND MY HEART!";


    let performance;


    if (
        timeLeft >= 60
    ) {

        performance =
            "Okayyy, speed demon! 😳🔥";

    }

    else if (
        timeLeft >= 30
    ) {

        performance =
            "That was pretty good! 😌💕";

    }

    else {

        performance =
            "You really had me worried there! 😂";

    }


    document.getElementById(
        "resultMessage"
    ).textContent =

        performance +

        " You made it through the maze "
        +
        "in "
        +
        moves
        +
        " moves with "
        +
        timeLeft
        +
        " seconds left. ❤️ "

        +

        "Maybe finding my heart "
        +
        "was worth the challenge. 🥹💗 "

        +

        "Happy Anniversary, my love!";



    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   LOSE GAME
========================= */

function loseGame() {

    if (gameOver) return;


    gameOver = true;

    clearInterval(timer);


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "resultEmoji"
    ).textContent =
        "😭💔";


    document.getElementById(
        "resultTitle"
    ).textContent =
        "TIME'S UP!";


    document.getElementById(
        "resultMessage"
    ).textContent =

        "The maze won this round. 😂💗 "

        +

        "You made "
        +
        moves
        +
        " moves, but couldn't reach "
        +
        "my heart before time ran out. "

        +

        "Maybe try a different path next time. 😈❤️";



    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   NEW MAZE
========================= */

function newMaze() {

    clearInterval(timer);


    moves = 0;

    timeLeft = TIME_LIMIT;

    gameOver = false;


    document.getElementById(
        "moves"
    ).textContent =
        "0";


    document.getElementById(
        "timer"
    ).textContent =
        TIME_LIMIT;


    document.getElementById(
        "timer"
    ).classList.remove(
        "warning"
    );


    document.getElementById(
        "message"
    ).textContent =
        "Swipe or use the arrows to find the ❤️!";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    generateMaze();

    drawMaze();

    startTimer();

}


/* =========================
   SWIPE CONTROLS
========================= */

let startX = 0;

let startY = 0;


const mazeElement =
    document.getElementById(
        "maze"
    );


mazeElement.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.touches[0];


        startX =
            touch.clientX;

        startY =
            touch.clientY;

    },
    {
        passive: true
    }
);


mazeElement.addEventListener(
    "touchend",
    function(event) {

        const touch =
            event.changedTouches[0];


        const endX =
            touch.clientX;

        const endY =
            touch.clientY;


        const dx =
            endX - startX;

        const dy =
            endY - startY;


        const threshold = 25;


        /*
           Ignore tiny touches.
        */

        if (
            Math.abs(dx) <
            threshold &&
            Math.abs(dy) <
            threshold
        ) {

            return;

        }


        /*
           Horizontal swipe.
        */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                move(1, 0);

            }

            else {

                move(-1, 0);

            }

        }


        /*
           Vertical swipe.
        */

        else {

            if (dy > 0) {

                move(0, 1);

            }

            else {

                move(0, -1);

            }

        }

    },
    {
        passive: true
    }
);


/* =========================
   START
========================= */

newMaze();

</script>

</body>

</html>
