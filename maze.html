<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love Maze 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eadcf7,
            #fff1f7,
            #f8dce9
        );

    color: #633f59;

    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 520px;

    padding:
        18px 14px
        35px;

    text-align: center;
}


/* =========================
   BACK TO MENU
========================= */

.menu-button {
    display: inline-block;

    margin-bottom: 8px;

    padding: 9px 17px;

    background: white;

    color: #bd5d85;

    text-decoration: none;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(100,50,90,0.12);
}

.menu-button:active {
    transform: scale(0.95);
}


/* =========================
   TITLE
========================= */

h1 {
    color: #b94f7b;

    font-size: 30px;

    margin: 7px 0 4px;
}

.subtitle {
    font-size: 14px;

    line-height: 1.5;

    margin-bottom: 14px;
}


/* =========================
   STATS
========================= */

.stats {
    display: flex;

    justify-content:
        space-around;

    background: white;

    border-radius: 18px;

    padding: 11px;

    margin-bottom: 14px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(100,50,90,0.08);
}

.warning {
    color: #c94d68;
}


/* =========================
   MAZE
========================= */

#maze {
    width: min(94vw, 455px);

    height: min(94vw, 455px);

    margin: auto;

    display: grid;

    background: #fff;

    border:
        4px solid #bd6a8b;

    border-radius: 14px;

    overflow: hidden;

    touch-action: none;

    box-shadow:
        0 9px 25px
        rgba(100,50,90,0.18);
}


/* =========================
   CELLS
========================= */

.cell {
    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #fff9fc;
}

.wall {
    background:
        #c98cab !important;
}


/* =========================
   PLAYER
========================= */

.player {
    width: 72%;
    height: 72%;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #f58db2;

    font-size:
        clamp(14px, 5vw, 27px);

    z-index: 3;

    box-shadow:
        0 3px 7px
        rgba(100,50,90,0.25);

    transition:
        transform 0.1s ease;
}


/* =========================
   GOAL
========================= */

.goal {
    font-size:
        clamp(17px, 6vw, 30px);

    animation:
        pulse 1.2s infinite;
}

@keyframes pulse {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }

}


/* =========================
   MESSAGE
========================= */

#message {
    min-height: 42px;

    margin: 13px 5px;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.5;
}


/* =========================
   CONTROLS
========================= */

.controls {
    width: 190px;

    margin:
        8px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.control {
    width: 58px;
    height: 50px;

    border: none;

    border-radius: 16px;

    background: white;

    color: #b94f7b;

    font-size: 21px;

    font-weight: bold;

    box-shadow:
        0 4px 10px
        rgba(100,50,90,0.12);
}

.control:active {
    transform: scale(0.91);
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}


/* =========================
   BUTTONS
========================= */

.new-maze {
    margin-top: 13px;

    padding: 12px 21px;

    border: none;

    border-radius: 22px;

    background: #bd5d85;

    color: white;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 5px 12px
        rgba(100,50,90,0.15);
}

.new-maze:active {
    transform: scale(0.95);
}


/* =========================
   RESULT
========================= */

#result {
    display: none;

    background: white;

    border-radius: 25px;

    padding: 25px 18px;

    margin-top: 18px;

    box-shadow:
        0 10px 30px
        rgba(100,50,90,0.15);
}

.resultEmoji {
    font-size: 58px;
}

.resultTitle {
    color: #b94f7b;

    font-size: 27px;
}

.resultMessage {
    font-size: 15px;

    line-height: 1.7;
}

.play-again {
    padding: 13px 22px;

    border: none;

    border-radius: 22px;

    background: #bd5d85;

    color: white;

    font-size: 15px;

    font-weight: bold;
}

.play-again:active {
    transform: scale(0.95);
}

</style>

</head>


<body>


<div class="game">


<a
    href="index.html"
    class="menu-button">

    🏠 Back to Menu

</a>


<h1>
    🧩 Love Maze 💕
</h1>


<div class="subtitle">

    Find your way to my heart
    before time runs out. 😈❤️

    <br>

    <small>
        Every game creates a new maze.
    </small>

</div>


<div class="stats">

    <div>

        ⏱️ Time:
        <span id="timer">
            90
        </span>s

    </div>


    <div>

        👣 Moves:
        <span id="moves">
            0
        </span>

    </div>

</div>


<div id="maze"></div>


<div id="message">

    Swipe or use the arrows
    to find the ❤️!

</div>


<div class="controls">


    <button
        class="control up"
        onclick="move(0,-1)">

        ⬆️

    </button>


    <button
        class="control left"
        onclick="move(-1,0)">

        ⬅️

    </button>


    <button
        class="control down"
        onclick="move(0,1)">

        ⬇️

    </button>


    <button
        class="control right"
        onclick="move(1,0)">

        ➡️

    </button>


</div>


<button
    class="new-maze"
    onclick="newMaze()">

    🔄 New Maze

</button>


<div id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
    </div>


    <h2
        class="resultTitle"
        id="resultTitle">
    </h2>


    <p
        class="resultMessage"
        id="resultMessage">
    </p>


    <button
        class="play-again"
        onclick="newMaze()">

        🧩 Try Another Maze

    </button>

</div>


</div>


<script>


/* =========================
   GAME SETTINGS
========================= */


/*
   15 x 15 makes the maze
   noticeably harder.

   Because the maze uses
   odd dimensions, the
   generator can create
   proper corridors.
*/

const SIZE = 15;


/*
   90 seconds gives an adult
   enough time to think but
   prevents taking forever.
*/

const TIME_LIMIT = 90;


let maze = [];

let player = {
    x: 1,
    y: 1
};

let goal = {
    x: SIZE - 2,
    y: SIZE - 2
};

let moves = 0;

let timeLeft = TIME_LIMIT;

let timer;

let gameOver = false;


/* =========================
   RANDOM NUMBER
========================= */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}

   CREATE EMPTY MAZE
========================= */
