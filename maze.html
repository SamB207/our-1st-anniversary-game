<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Love Quiz ❤️</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5ebe6;
      color: #4a3b32;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .quiz-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    /* Back to Menu Button Styling */
    .menu-button {
      display: inline-block;
      margin-bottom: 8px;
      padding: 9px 17px;
      background: #8b6c5c;
      color: #ffffff; /* Changed to white for better readability on brown */
      text-decoration: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(100,50,90,0.12);
      transition: transform 0.1s ease;
      cursor: pointer;
      border: none;
    }

    .menu-button:active {
      transform: scale(0.95);
    }

    .progress {
      font-size: 14px;
      color: #8b6c5c;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .question {
      font-size: 18px;
      margin-bottom: 20px;
      color: #3a2e2b;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #fdf8f5;
      border: 2px solid #e0d0c8;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      color: #4a3b32;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .option-btn:hover {
      background: #f4e8e1;
      border-color: #8b6c5c;
    }

    .result-container {
      display: none;
    }

    .result-score {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #8b6c5c;
    }

    .result-message {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <a href="index.html" class="menu-button">← Back to Menu</a>

    <!-- Quiz Screen -->
    <div id="quiz-screen">
      <div class="progress" id="progress">Question 1 of 15</div>
      <div class="question" id="question">Loading question...</div>
      <div class="options-container" id="options"></div>
    </div>

    <!-- Results Screen -->
    <div id="result-screen" class="result-container">
      <h2>Quiz Finished! 💕</h2>
      <div class="result-score" id="score-text"></div>
      <div class="result-message" id="message-text"></div>
      <button class="menu-button" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
  </div>

  <script>
    const quizData = [
      // Questions about "Us"
      {
        question: "1. Where was our very first official date?",
        options: ["Burger place", "roof top", "Bryan Park", "Pool night"],
        correct: 1
      },
      {
        question: "2. What was the first nickname you called me?",
        options: ["Gorgeous", "My love", "My heart", "Mi amor"],
        correct: 0
      },
      {
        question: "3. What is the food we have ate the most together?",
        options: ["Noodles", "Pizza", "Pasta", "Burgers"],
        correct: 0
      },
      {
        question: "4. Where was our first kiss?",
        options: ["Beach", "Park", "My house", "Amusement park"],
        correct: 2
      },
      {
        question: "5. What is our official anniversary date?",
        options: ["January 14", "June 20", "October 5", "August 21"], // Edit as needed!
        correct: 3
      },
      {
        question: "6. Who usually takes longer to get ready?",
        options: ["Me, obviously 💅", "You! ⏰", "We are equally slow", "Neither, we are super fast"],
        correct: 3
      },
      {
        question: "7. What is my favorite color?",
        options: ["Red", "Pink", "Green", "Black"],
        correct: 3
      },

      // Questions about "Me"
      {
        question: "8. Which app do I tell you to use but you don't check?",
        options: ["X", "Facebook", "Flame", "circle360"],
        correct: 2
      },
      {
        question: "9. What is my biggest flaw from these?",
        options: ["Loud chewing", "Being late", "Slow walker", "Messy rooms"],
        correct: 3
      },
      {
        question: "10. What is my favorite ice cream flavor?",
        options: ["Chocolate Fudge", "Vanilla Bean", "Mint Chocolate Chip", "Cookie Dough"],
        correct: 2
      },
      {
        question: "11. What is my dream travel destination?",
        options: ["Japan", "Italy", "Greece", "Iceland"],
        correct: 0
      },
      {
        question: "12. What was my favorite subject growing up?",
        options: ["Art", "English", "History", "Science"],
        correct: 0
      },
      {
        question: "13. How do I usually take my coffee/tea?",
        options: ["Black / Plain", "Extra sweet with cream", "Just a splash of milk", "I don't drink caffeinated drinks"],
        correct: 1
      },
      {
        question: "14. If I could only eat one meal for the rest of my life, what is it?",
        options: ["Tacos", "Pasta", "Ramen", "Steak"],
        correct: 1
      },
      {
        question: "15. What is my favorite thing about you?",
        options: ["Your smile 😊", "Your sense of humor 😂", "How caring you are ❤️", "All of the above! 🥰"],
        correct: 3
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const progressEl = document.getElementById('progress');
    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const scoreTextEl = document.getElementById('score-text');
    const messageTextEl = document.getElementById('message-text');

    function loadQuestion() {
      const currentQuiz = quizData[currentQuestionIndex];
      progressEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
      questionEl.innerText = currentQuiz.question;
      
      optionsEl.innerHTML = '';
      currentQuiz.options.forEach((optionText, index) => {
        const button = document.createElement('button');
        button.classList.add('option-btn');
        button.innerText = optionText;
        button.onclick = () => selectOption(index);
        optionsEl.appendChild(button);
      });
    }

    function selectOption(selectedIndex) {
      if (selectedIndex === quizData[currentQuestionIndex].correct) {
        score++;
      }
      
      currentQuestionIndex++;
      
      if (currentQuestionIndex < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizScreen.style.display = 'none';
      resultScreen.style.display = 'block';

      const percentage = Math.round((score / quizData.length) * 100);
      scoreTextEl.innerText = `You scored ${score} / ${quizData.length} (${percentage}%)`;

      let message = "";

      if (percentage <= 30) {
        message = "Hmm... 🤨 Are you sure you know who I am?! I think you need a refresher course on us! You owe me a date night to catch up! ❤️";
      } else if (percentage <= 50) {
        message = "Not terrible, but definitely room for improvement! 😉 We need to spend more quality time together so you can study up! 📝💕";
      } else if (percentage <= 80) {
        message = "Pretty good job, bae! 💖 You definitely pay attention, though a few trick questions got you. I still love you tons! 🥰";
      } else {
        message = "WOW! 🏆 Perfect / near-perfect score! You really know me inside and out. You truly are my soulmate and my favorite person ever! ❤️👑";
      }

      messageTextEl.innerText = message;
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      resultScreen.style.display = 'none';
      quizScreen.style.display = 'block';
      loadQuestion();
    }

    // Initialize quiz
    loadQuestion();
  </script>
</body>
</html>
