<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Love Maze 💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffdce9,
            #fff2f7,
            #ffd4e4
        );

    color: #71394f;

    display: flex;

    justify-content: center;
}


.game {

    width: 100%;

    max-width: 500px;

    padding:
        20px 15px
        35px;

    text-align: center;
}


/* =========================
   MENU BUTTON
========================= */

.menu-button {

    display: inline-block;

    margin-bottom: 8px;

    padding: 9px 17px;

    background: white;

    color: #d94f7a;

    text-decoration: none;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(120,50,80,0.12);
}

.menu-button:active {

    transform: scale(0.95);

}


/* =========================
   TITLE
========================= */

h1 {

    color: #d94f7a;

    font-size: 31px;

    margin: 8px 0 5px;
}

.subtitle {

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================
   STATS
========================= */

.stats {

    display: flex;

    justify-content:
        space-around;

    background: white;

    border-radius: 18px;

    padding: 10px;

    margin-bottom: 15px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(120,50,80,0.08);
}


/* =========================
   MAZE
========================= */

#maze {

    width: min(
        92vw,
        430px
    );

    height: min(
        92vw,
        430px
    );

    margin: auto;

    display: grid;

    background: #fff;

    border:
        4px solid #d94f7a;

    border-radius: 15px;

    overflow: hidden;

    touch-action: none;

    box-shadow:
        0 8px 25px
        rgba(120,50,80,0.15);
}


/* =========================
   CELLS
========================= */

.cell {

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #fff7fa;
}


/* walls */

.wall-top {

    border-top:
        3px solid #d47b98;
}

.wall-right {

    border-right:
        3px solid #d47b98;
}

.wall-bottom {

    border-bottom:
        3px solid #d47b98;
}

.wall-left {

    border-left:
        3px solid #d47b98;
}


/* =========================
   PLAYER
========================= */

.player {

    width: 70%;

    height: 70%;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        #ff9fbe;

    font-size:
        clamp(
            18px,
            7vw,
            30px
        );

    z-index: 3;

    box-shadow:
        0 3px 7px
        rgba(120,50,80,0.2);

    transition:
        transform 0.12s ease;
}


/* =========================
   GOAL
========================= */

.goal {

    font-size:
        clamp(
            20px,
            7vw,
            32px
        );

    animation:
        pulse 1.2s infinite;
}


@keyframes pulse {

    0%,100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.12);

    }

}


/* =========================
   MESSAGE
========================= */

#message {

    min-height: 42px;

    margin: 15px 5px;

    font-weight: bold;

    font-size: 14px;

    line-height: 1.5;
}


/* =========================
   CONTROLS
========================= */

.controls {

    width: 190px;

    margin:
        10px auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;
}


.control {

    width: 58px;

    height: 52px;

    border: none;

    border-radius: 16px;

    background: white;

    color: #d94f7a;

    font-size: 22px;

    font-weight: bold;

    box-shadow:
        0 4px 10px
        rgba(120,50,80,0.12);
}


.control:active {

    transform:
        scale(0.92);

}


.up {

    grid-column: 2;

}

.left {

    grid-column: 1;

    grid-row: 2;

}

.down {

    grid-column: 2;

    grid-row: 2;

}

.right {

    grid-column: 3;

    grid-row: 2;

}


/* =========================
   NEW MAZE
========================= */

.new-maze {

    margin-top: 15px;

    padding: 12px 20px;

    border: none;

    border-radius: 22px;

    background: #d94f7a;

    color: white;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 5px 12px
        rgba(120,50,80,0.15);
}


.new-maze:active {

    transform:
        scale(0.95);

}


/* =========================
   RESULT
========================= */

#result {

    display: none;

    background: white;

    border-radius: 25px;

    padding: 25px 18px;

    margin-top: 20px;

    box-shadow:
        0 10px 30px
        rgba(120,50,80,0.15);
}


.resultEmoji {

    font-size: 60px;

}


.resultTitle {

    color: #d94f7a;

    font-size: 28px;

}


.resultMessage {

    font-size: 15px;

    line-height: 1.7;

}


.play-again {

    padding: 13px 22px;

    border: none;

    border-radius: 22px;

    background: #e95b88;

    color: white;

    font-size: 15px;

    font-weight: bold;
}

</style>

</head>


<body>


<div class="game">


<!-- MENU -->

<a
    href="index.html"
    class="menu-button">

    🏠 Back to Menu

</a>


<h1>

    🧩 Love Maze 💕

</h1>


<div class="subtitle">

    Find your way to my heart! ❤️
    <br>
    The maze changes every game! 🔄

</div>


<!-- STATS -->

<div class="stats">

    <div>

        ⏱️
        <span id="timer">
            0
        </span>s

    </div>


    <div>

        👣
        <span id="moves">
            0
        </span>

    </div>

</div>


<!-- MAZE -->

<div id="maze"></div>


<div id="message">

    Swipe or use the buttons
    to move! 💕

</div>


<!-- CONTROLS -->

<div class="controls">

    <button
        class="control up"
        onclick="move(0,-1)">

        ⬆️

    </button>


    <button
        class="control left"
        onclick="move(-1,0)">

        ⬅️

    </button>


    <button
        class="control down"
        onclick="move(0,1)">

        ⬇️

    </button>


    <button
        class="control right"
        onclick="move(1,0)">

        ➡️

    </button>

</div>


<button
    class="new-maze"
    onclick="newMaze()">

    🔄 New Maze

</button>


<!-- RESULT -->

<div id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
    </div>


    <h2
        class="resultTitle"
        id="resultTitle">
    </h2>


    <p
        class="resultMessage"
        id="resultMessage">
    </p>


    <button
        class="play-again"
        onclick="newMaze()">

        🧩 Try Another Maze

    </button>

</div>


</div>


<script>


/* =========================
   MAZE SETTINGS
========================= */

const SIZE = 11;


/*
   Odd numbers work best
   for this maze algorithm.
*/


let maze = [];

let player = {
    x: 0,
    y: 0
};

let goal = {
    x: SIZE - 1,
    y: SIZE - 1
};

let moves = 0;

let seconds = 0;

let timer;

let gameOver = false;


/* =========================
   CREATE MAZE
========================= */

function generateMaze() {


    /*
       Start with every cell
       as a wall.
    */

    maze = [];


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        maze[y] = [];

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {

            maze[y][x] = 1;

        }

    }


    /*
       Maze generation using
       recursive backtracking.
    */

    function carve(x, y) {

        maze[y][x] = 0;


        const directions = [

            [2, 0],

            [-2, 0],

            [0, 2],

            [0, -2]

        ];


        /*
           Shuffle directions
           to make each maze
           different.
        */

        directions.sort(
            () => Math.random() - 0.5
        );


        for (
            const direction
            of directions
        ) {

            const nx =
                x + direction[0];

            const ny =
                y + direction[1];


            if (
                nx > 0 &&
                nx < SIZE - 1 &&
                ny > 0 &&
                ny < SIZE - 1 &&
                maze[ny][nx] === 1
            ) {


                maze[
                    y + direction[1] / 2
                ][
                    x + direction[0] / 2
                ] = 0;


                carve(nx, ny);

            }

        }

    }


    /*
       Start at top-left.
    */

    carve(1, 1);


    /*
       Open starting position.
    */

    maze[1][1] = 0;


    /*
       Open ending position.
    */

    maze[
        SIZE - 2
    ][
        SIZE - 2
    ] = 0;


    player = {

        x: 1,

        y: 1

    };


    goal = {

        x: SIZE - 2,

        y: SIZE - 2

    };

}


/* =========================
   DRAW MAZE
========================= */

function drawMaze() {

    const mazeElement =
        document.getElementById(
            "maze"
        );


    mazeElement.innerHTML = "";


    mazeElement.style.gridTemplateColumns =
        `repeat(${SIZE}, 1fr)`;


    mazeElement.style.gridTemplateRows =
        `repeat(${SIZE}, 1fr)`;


    for (
        let y = 0;
        y < SIZE;
        y++
    ) {

        for (
            let x = 0;
            x < SIZE;
            x++
        ) {


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            /*
               Walls
            */

            if (
                maze[y][x] === 1
            ) {

                cell.style.background =
                    "#e8a6bb";

            }


            /*
               Player
            */

            if (
                x === player.x &&
                y === player.y
            ) {

                const playerElement =
                    document.createElement(
                        "div"
                    );

                playerElement.className =
                    "player";

                playerElement.textContent =
                    "💗";

                cell.appendChild(
                    playerElement
                );

            }


            /*
               Goal
            */

            if (
                x === goal.x &&
                y === goal.y
            ) {

                const goalElement =
                    document.createElement(
                        "div"
                    );

                goalElement.className =
                    "goal";

                goalElement.textContent =
                    "❤️";

                cell.appendChild(
                    goalElement
                );

            }


            mazeElement.appendChild(
                cell
            );

        }

    }

}


/* =========================
   MOVE
========================= */

function move(dx, dy) {

    if (gameOver) return;


    const newX =
        player.x + dx;

    const newY =
        player.y + dy;


    /*
       Check boundaries
    */

    if (
        newX < 0 ||
        newX >= SIZE ||
        newY < 0 ||
        newY >= SIZE
    ) {

        return;

    }


    /*
       Check wall
    */

    if (
        maze[newY][newX] === 1
    ) {

        document.getElementById(
            "message"
        ).textContent =
            "💥 Oops! That's a wall!";

        return;

    }


    /*
       Move player
    */

    player.x = newX;

    player.y = newY;

    moves++;


    document.getElementById(
        "moves"
    ).textContent =
        moves;


    drawMaze();


    /*
       Check goal
    */

    if (
        player.x === goal.x &&
        player.y === goal.y
    ) {

        winGame();

    }

}


/* =========================
   WIN
========================= */

function winGame() {

    gameOver = true;

    clearInterval(timer);


    document.getElementById(
        "result"
    ).style.display =
        "block";


    document.getElementById(
        "resultEmoji"
    ).textContent =
        "🥹💕";


    document.getElementById(
        "resultTitle"
    ).textContent =
        "YOU FOUND MY HEART!";


    document.getElementById(
        "resultMessage"
    ).textContent =
        "You made it through the maze! ❤️ "
        +
        "It took you "
        +
        moves +
        " moves and "
        +
        seconds +
        " seconds. "
        +
        "No matter how complicated the path gets, "
        +
        "I would always choose you. 🥹💕 "
        +
        "Happy Anniversary, my love!";

}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timer);


    timer = setInterval(
        function() {

            if (!gameOver) {

                seconds++;


                document.getElementById(
                    "timer"
                ).textContent =
                    seconds;

            }

        },
        1000
    );

}


/* =========================
   NEW MAZE
========================= */

function newMaze() {

    clearInterval(timer);


    moves = 0;

    seconds = 0;

    gameOver = false;


    document.getElementById(
        "moves"
    ).textContent =
        "0";


    document.getElementById(
        "timer"
    ).textContent =
        "0";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    document.getElementById(
        "message"
    ).textContent =
        "Swipe or use the buttons to move! 💕";


    generateMaze();

    drawMaze();

    startTimer();

}


/* =========================
   SWIPE CONTROLS
========================= */

let startX = 0;

let startY = 0;


const mazeElement =
    document.getElementById(
        "maze"
    );


mazeElement.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.touches[0];


        startX =
            touch.clientX;

        startY =
            touch.clientY;

    },
    {
        passive: true
    }
);


mazeElement.addEventListener(
    "touchend",
    function(event) {

        const touch =
            event.changedTouches[0];


        const endX =
            touch.clientX;

        const endY =
            touch.clientY;


        const dx =
            endX - startX;

        const dy =
            endY - startY;


        const threshold = 25;


        if (
            Math.abs(dx) <
            threshold &&
            Math.abs(dy) <
            threshold
        ) {

            return;

        }


        /*
           Horizontal swipe
        */

        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (dx > 0) {

                move(1, 0);

            }

            else {

                move(-1, 0);

            }

        }


        /*
           Vertical swipe
        */

        else {

            if (dy > 0) {

                move(0, 1);

            }

            else {

                move(0, -1);

            }

        }

    },
    {
        passive: true
    }
);


/* =========================
   START GAME
========================= */

newMaze();

</script>

</body>

</html>
