<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cupid's Labyrinth - Anniversary Edition</title>
  <style>
    :root {
      --primary-color: #ffdde1;
      --secondary-color: #ee9ca7;
      --accent-color: #ff6b6b;
      --text-color: #a61e4d;
      --wall-color: #d6336c;
      --path-color: #fff0f3;
      --highlight-color: #ff85a1;
      --btn-color: #ee9ca7;
      --btn-hover: #d6336c;
    }

    * {
      box-sizing: border-box;
      touch-action: none; /* Prevents scrolling while playing */
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden; /* Important for full-screen game */
    }

    header {
      padding: 15px 20px 5px;
      text-align: center;
    }

    /* Back to Menu Button Styling */
    .menu-button {
      display: inline-block;
      margin-bottom: 8px;
      padding: 9px 17px;
      background: #8b6c5c;
      color: #ffffff; /* Changed to white for better readability on brown */
      text-decoration: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(100,50,90,0.12);
      transition: transform 0.1s ease;
    }

    .menu-button:active {
      transform: scale(0.95);
    }

    h1 {
      margin: 0;
      color: var(--text-color);
      font-size: 1.8rem;
    }

    p.subtitle {
      margin: 5px 0 0;
      color: var(--text-color);
      font-size: 0.95rem;
      opacity: 0.85;
    }

    #game-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      position: relative;
    }

    #maze-grid {
      display: grid;
      border: 6px solid var(--wall-color);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      background-color: var(--path-color);
      border-radius: 8px;
    }

    .cell {
      width: 15px; /* Adjust for larger/smaller maze */
      height: 15px;
      background-color: var(--path-color);
    }

    .wall {
      background-color: var(--wall-color);
    }

    .start {
      background-color: #8ce99a; /* Light green for start */
    }

    .end {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23d6336c"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
      background-size: cover;
    }

    #player {
      position: absolute;
      width: 15px;
      height: 15px;
      background-color: var(--highlight-color);
      border-radius: 50%;
      border: 2px solid white;
      transition: all 0.05s linear;
      z-index: 10;
    }

    #game-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding: 15px;
    }

    #controls {
      display: grid;
      grid-template-columns: 50px 50px 50px;
      gap: 10px;
      justify-items: center;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      background-color: rgba(255, 255, 255, 0.5);
      border: 2px solid var(--text-color);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: var(--text-color);
      cursor: pointer;
    }

    .control-btn:active {
      background-color: var(--highlight-color);
    }

    #up-btn { grid-column: 2; }
    #down-btn { grid-column: 2; grid-row: 3; }
    #left-btn { grid-column: 1; grid-row: 2; }
    #right-btn { grid-column: 3; grid-row: 2; }

    #reset-btn {
      padding: 10px 20px;
      background-color: var(--wall-color);
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
    }

    #win-screen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      color: var(--text-color);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #win-screen.visible {
      display: flex;
    }

    #heart-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    #play-again-btn {
      padding: 12px 24px;
      background-color: var(--wall-color);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="menu-button">← Back to Menu</a>
    <h1>Cupid's Labyrinth</h1>
    <p class="subtitle">Navigate to the heart before it's too late!</p>
  </header>

  <div id="game-container">
    <div id="maze-grid">
      <div id="player"></div>
    </div>

    <div id="win-screen">
      <div id="heart-icon">💖</div>
      <h2>You found your way to my heart!</h2>
      <button id="play-again-btn">Play Again 💕</button>
    </div>
  </div>

  <div id="game-ui">
    <div id="controls">
      <button id="up-btn" class="control-btn">▲</button>
      <button id="left-btn" class="control-btn">◀</button>
      <button id="down-btn" class="control-btn">▼</button>
      <button id="right-btn" class="control-btn">▶</button>
    </div>
    <button id="reset-btn">Reset Labyrinth</button>
  </div>

  <script>
    const MAZE_WIDTH = 31; // Must be odd
    const MAZE_HEIGHT = 21; // Must be odd
    const CELL_SIZE = 15; // Must match CSS

    const grid = [];
    const playerPosition = { x: 1, y: 1 };
    let playerElement;

    // Build the initial grid
    function setupGrid() {
      const mazeGrid = document.getElementById('maze-grid');
      mazeGrid.style.gridTemplateColumns = `repeat(${MAZE_WIDTH}, ${CELL_SIZE}px)`;
      mazeGrid.style.gridTemplateRows = `repeat(${MAZE_HEIGHT}, ${CELL_SIZE}px)`;

      playerElement = document.getElementById('player');
      updatePlayerPosition();

      for (let y = 0; y < MAZE_HEIGHT; y++) {
        grid[y] = [];
        for (let x = 0; x < MAZE_WIDTH; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell wall';
          if (x === 0 || x === MAZE_WIDTH - 1 || y === 0 || y === MAZE_HEIGHT - 1) {
            cell.classList.add('boundary');
          }
          mazeGrid.appendChild(cell);
          grid[y][x] = { element: cell, isWall: true };
        }
      }
    }

    // Recursive backtracking maze generation
    function generateMaze() {
      const directions = [
        [0, -2], // Up
        [0, 2],  // Down
        [-2, 0], // Left
        [2, 0]   // Right
      ];

      function carve(x, y) {
        grid[y][x].isWall = false;
        grid[y][x].element.classList.remove('wall');

        const shuffledDirections = directions.sort(() => Math.random() - 0.5);

        for (const [dx, dy] of shuffledDirections) {
          const nextX = x + dx;
          const nextY = y + dy;

          if (nextX > 0 && nextX < MAZE_WIDTH - 1 && nextY > 0 && nextY < MAZE_HEIGHT - 1 && grid[nextY][nextX].isWall) {
            const wallX = x + dx / 2;
            const wallY = y + dy / 2;
            grid[wallY][wallX].isWall = false;
            grid[wallY][wallX].element.classList.remove('wall');
            carve(nextX, nextY);
          }
        }
      }

      carve(1, 1);

      // Add Start and End points
      grid[1][1].element.classList.add('start');
      const endPoint = { x: MAZE_WIDTH - 2, y: MAZE_HEIGHT - 2 };
      grid[endPoint.y][endPoint.x].element.classList.add('end');
      grid[endPoint.y][endPoint.x].isWall = false;
    }

    function resetGame() {
      const mazeGrid = document.getElementById('maze-grid');
      mazeGrid.innerHTML = '<div id="player"></div>';
      playerPosition.x = 1;
      playerPosition.y = 1;
      setupGrid();
      generateMaze();
      const winScreen = document.getElementById('win-screen');
      winScreen.classList.remove('visible');
    }

    function updatePlayerPosition() {
      playerElement.style.left = `${playerPosition.x * CELL_SIZE}px`;
      playerElement.style.top = `${playerPosition.y * CELL_SIZE}px`;
    }

    function checkWin() {
      if (playerPosition.x === MAZE_WIDTH - 2 && playerPosition.y === MAZE_HEIGHT - 2) {
        const winScreen = document.getElementById('win-screen');
        winScreen.classList.add('visible');
      }
    }

    // Keyboard Controls
    document.addEventListener('keydown', (e) => {
      let moved = false;
      switch (e.key) {
        case 'ArrowUp':
          if (!grid[playerPosition.y - 1][playerPosition.x].isWall) { playerPosition.y--; moved = true; }
          break;
        case 'ArrowDown':
          if (!grid[playerPosition.y + 1][playerPosition.x].isWall) { playerPosition.y++; moved = true; }
          break;
        case 'ArrowLeft':
          if (!grid[playerPosition.y][playerPosition.x - 1].isWall) { playerPosition.x--; moved = true; }
          break;
        case 'ArrowRight':
          if (!grid[playerPosition.y][playerPosition.x + 1].isWall) { playerPosition.x++; moved = true; }
          break;
      }
      if (moved) {
        updatePlayerPosition();
        checkWin();
        e.preventDefault();
      }
    });

    // Button Controls
    document.getElementById('up-btn').addEventListener('click', () => { if (!grid[playerPosition.y - 1][playerPosition.x].isWall) { playerPosition.y--; updatePlayerPosition(); checkWin(); } });
    document.getElementById('down-btn').addEventListener('click', () => { if (!grid[playerPosition.y + 1][playerPosition.x].isWall) { playerPosition.y++; updatePlayerPosition(); checkWin(); } });
    document.getElementById('left-btn').addEventListener('click', () => { if (!grid[playerPosition.y][playerPosition.x - 1].isWall) { playerPosition.x--; updatePlayerPosition(); checkWin(); } });
    document.getElementById('right-btn').addEventListener('click', () => { if (!grid[playerPosition.y][playerPosition.x + 1].isWall) { playerPosition.x++; updatePlayerPosition(); checkWin(); } });

    document.getElementById('reset-btn').addEventListener('click', resetGame);
    document.getElementById('play-again-btn').addEventListener('click', resetGame);

    resetGame();
  </script>
</body>
</html>
