<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Much You Know Me? 🔍💕</title>
  <style>
    body {
      background-color: #2b1e1e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .btn-back {
      background: #ffffff;
      color: #2b1e1e;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 0;
    }

    .question-title {
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #a3b899;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .score-text {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="btn-back">🏠 Back to Menu</a>

  <div class="card">
    <h1>How Much You Know Me? 🔍💕</h1>
    <p class="subtitle">Answer carefully... 🙈</p>
  </div>

  <div class="card" id="quiz-card">
    <div class="question-title" id="question-number">QUESTION 1</div>
    <div class="question-text" id="question-text">Loading question...</div>
    <div class="options-grid" id="options-container"></div>
  </div>

  <script>
    // Customize your questions, options, and correct answers here
    const quizData = [
      {
        question: "Where did we first meet?",
        options: ["Coffee Shop", "At a Party", "Online", "Park"],
        answer: 2
      },
      {
        question: "What is my absolute favorite food?",
        options: ["Pizza", "Sushi", "Tacos", "Pasta"],
        answer: 1
      },
      {
        question: "Which movie is my top favorite?",
        options: ["Inception", "La La Land", "Interstellar", "The Notebook"],
        answer: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionNumberEl = document.getElementById("question-number");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const quizCardEl = document.getElementById("quiz-card");

    function loadQuestion() {
      const q = quizData[currentQuestion];
      questionNumberEl.textContent = `QUESTION ${currentQuestion + 1} OF ${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainerEl.innerHTML = "";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = () => selectOption(index);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (selectedIndex === quizData[currentQuestion].answer) {
        score++;
      }

      currentQuestion++;

      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizCardEl.innerHTML = `
        <div class="question-title">QUIZ COMPLETED! 🎉</div>
        <div class="score-text">You scored ${score} out of ${quizData.length}!</div>
        <button class="btn-back" style="margin-top: 10px;" onclick="location.reload()">Play Again</button>
      `;
    }

    // Initialize the quiz immediately on load
    loadQuestion();
  </script>

</body>
</html>
