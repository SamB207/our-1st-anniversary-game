<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Much You Know Me? 🔍💕</title>
  <style>
    body {
      background-color: #2b1e1e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .btn-back {
      background: #ffffff;
      color: #2b1e1e;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      text-decoration: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 0;
    }

    .question-title {
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: #a3b899;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Feedback Styles */
    .option-btn.correct {
      background-color: #2e7d32 !important;
      border-color: #4caf50 !important;
      color: #ffffff !important;
    }

    .option-btn.wrong {
      background-color: #c62828 !important;
      border-color: #ef5350 !important;
      color: #ffffff !important;
    }

    .score-text {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="btn-back">🏠 Back to Menu</a>

  <div class="card">
    <h1>How Much You Know Me? 🔍💕</h1>
    <p class="subtitle">Answer carefully... 🙈</p>
  </div>

  <div class="card" id="quiz-card">
    <div class="question-title" id="question-number">QUESTION 1</div>
    <div class="question-text" id="question-text">Loading question...</div>
    <div class="options-grid" id="options-container"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "0. How well do you know your girlfriend?",
        options: ["Pretty well", "Really well", "Better than anyone", "I'm about to find out"],
        correct: 3
      },
      {
        question: "1. Where was our very first official date?",
        options: ["Burger place", "roof top", "Bryan Park", "Pool night"],
        correct: 1
      },
      {
        question: "2. What was the first nickname you called me?",
        options: ["Gorgeous", "My love", "My heart", "Mi amor"],
        correct: 0
      },
      {
        question: "3. What is the food we have ate the most together?",
        options: ["Noodles", "Pizza", "Pasta", "Burgers"],
        correct: 0
      },
      {
        question: "4. Where was our first kiss?",
        options: ["Beach", "Park", "My house", "Amusement park"],
        correct: 1
      },
      {
        question: "5. What is our official anniversary date?",
        options: ["January 14", "June 20", "October 5", "August 21"],
        correct: 3
      },
      {
        question: "6. Who usually takes longer to get ready?",
        options: ["Me, obviously 💅", "You! ⏰", "We are equally slow", "Neither, we are super fast"],
        correct: 2
      },
      {
        question: "7. What is my favorite color?",
        options: ["Red", "Pink", "Green", "Black"],
        correct: 2
      },
      {
        question: "8. Which app do I tell you to use but you don't check?",
        options: ["X", "Facebook", "Flame", "circle360"],
        correct: 2
      },
      {
        question: "9. What is my biggest flaw from these?",
        options: ["Loud chewing", "Being late", "Slow walker", "Messy rooms"],
        correct: 3
      },
      {
        question: "10. Who is more dramatic ?",
        options: ["definitely you", "Neither.... supposedly", "Both equally", "Me (Your love)"],
        correct: 3
      },
      {
        question: "11. What is my favorite ice cream flavor?",
        options: ["Chocolate Fudge", "Vanilla Bean", "Mint Chocolate Chip", "Cookie Dough"],
        correct: 2
      },
      {
        question: "12. What is my dream travel destination?",
        options: ["Japan", "Italy", "Greece", "Iceland"],
        correct: 0
      },
      {
        question: "13. Where did we meet first?",
        options: ["Broadway", "Atlantic/Barclay Center", "Far Rock", "Jamaica"],
        correct: 3
      },
      {
        question: "14. What was my favorite subject growing up?",
        options: ["Art", "English", "History", "Science"],
        correct: 0
      },
      {
        question: "15. When I said \"I'm fine\" what does it usually mean?",
        options: ["I'm completely fine", "Nothing is wrong", "Figure it out", "You should probably apologize just in case"],
        correct: 3
      },
      {
        question: "16. How do I usually take my coffee/tea?",
        options: ["Black / Plain", "Extra sweet with cream", "Just a splash of milk", "I don't drink caffeinated drinks"],
        correct: 1
      },
      {
        question: "17. Who is more likely to start an argument over something small?",
        options: ["Both", "Me (your perfect cute little girlfriend)", "You", "Neither of us"],
        correct: 1
      },
      {
        question: "18. Who made me fall in love with all the details he has that made me impossible not to look how cute he is?",
        options: ["Tom", "Spiderman", "You, silly dummy cute handsome guy, that is totally mine", "The Neightboor"],
        correct: 2
      },
      {
        question: "19. What is my favorite thing about you?",
        options: ["Your smile 😊", "Your sense of humor 😂", "How caring you are ❤️", "All of the above! 🥰"],
        correct: 3
      },
      {
        question: "20. Where did we go pitching by ourself?",
        options: ["Jamaica", "Atlantic/Barclay Center", "149th", "Parkchester"],
        correct: 1
      },
      {
        question: "21. Who said I love you first?",
        options: ["You", "Both at the same time", "Diana", "Me (your love)"],
        correct: 0
      },
      {
        question: "22. What is my favorite thing to do with you?",
        options: ["Going on dates outside", "Eat together", "Have in-house dates (just spending time lying down/playing games)", "All above"],
        correct: 3
      },
      {
        question: "23. Who is more likely to fall asleep first ?",
        options: ["You", "None of us", "Both", "Me (Your love)"],
        correct: 0
      },
      {
        question: "24. Who is more likely to say \"I'm not mad\" while clearly being mad?",
        options: ["Absolutely You", "Both", "Me (Your love)", "None"],
        correct: 0
      },
      {
        question: "25. Who took my first time👉👈?",
        options: ["My ex", "Definitely You", "Almost you", "no one"],
        correct: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let isAnswering = false;

    const questionNumberEl = document.getElementById("question-number");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainerEl = document.getElementById("options-container");
    const quizCardEl = document.getElementById("quiz-card");

    function loadQuestion() {
      isAnswering = false;
      const q = quizData[currentQuestion];
      questionNumberEl.textContent = `QUESTION ${currentQuestion + 1} OF ${quizData.length}`;
      questionTextEl.textContent = q.question;
      optionsContainerEl.innerHTML = "";

      q.options.forEach((option, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = option;
        btn.onclick = (e) => selectOption(index, e.target);
        optionsContainerEl.appendChild(btn);
      });
    }

    function selectOption(selectedIndex, selectedBtn) {
      if (isAnswering) return; // Prevent double-clicking
      isAnswering = true;

      const correctIndex = quizData[currentQuestion].correct;
      const buttons = optionsContainerEl.querySelectorAll(".option-btn");

      if (selectedIndex === correctIndex) {
        score++;
        selectedBtn.classList.add("correct");
      } else {
        selectedBtn.classList.add("wrong");
        // Highlight the correct answer in green as well
        if (buttons[correctIndex]) {
          buttons[correctIndex].classList.add("correct");
        }
      }

      // Delay loading the next question so the user sees the color effect
      setTimeout(() => {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
          loadQuestion();
        } else {
          showResults();
        }
      }, 1200);
    }

    function showResults() {
      quizCardEl.innerHTML = `
        <div class="question-title">QUIZ COMPLETED! 🎉</div>
        <div class="score-text">You scored ${score} out of ${quizData.length}!</div>
        <button class="btn-back" style="margin-top: 10px;" onclick="location.reload()">Play Again</button>
      `;
    }

    // Initialize the quiz immediately on load
    loadQuestion();
  </script>

</body>
</html>
