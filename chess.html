<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensures proper scaling on iPhone and mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile Chess Game</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none; /* Prevents text selection on mobile taps */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h2 {
      margin: 0 0 10px 0;
      color: #333;
    }

    #status {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    /* Mobile Responsive Board Container */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      max-width: 400px; /* Limits size on larger screens */
      aspect-ratio: 1 / 1;
      border: 3px solid #333;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      touch-action: manipulation;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(10vw, 42px); /* Scales font dynamically based on screen width */
      cursor: pointer;
    }

    /* Board Colors */
    .light {
      background-color: #f0d9b5;
    }

    .dark {
      background-color: #b58863;
    }

    /* Touch Highlighting */
    .selected {
      background-color: #7bc043 !important;
    }

    .possible-move {
      position: relative;
    }

    .possible-move::after {
      content: '';
      width: 30%;
      height: 30%;
      background-color: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background-color: #007aff; /* iOS Blue */
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h2>Chess</h2>
  <div id="status">Turn: White</div>
  <div id="board"></div>
  <button onclick="resetGame()">New Game</button>

  <script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');

    // Unicode Chess Symbols
    const pieces = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    // Initial Board Setup
    const initialBoard = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let gameState = [];
    let selectedSquare = null;
    let turn = 'white'; // 'white' (uppercase) or 'black' (lowercase)

    function isWhite(piece) {
      return piece && piece === piece.toUpperCase();
    }

    function isBlack(piece) {
      return piece && piece === piece.toLowerCase();
    }

    function initGame() {
      gameState = JSON.parse(JSON.stringify(initialBoard));
      turn = 'white';
      selectedSquare = null;
      statusElement.textContent = "Turn: White";
      renderBoard();
    }

    function renderBoard() {
      boardElement.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.classList.add('square');
          square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
          square.dataset.row = r;
          square.dataset.col = c;

          const piece = gameState[r][c];
          if (piece) {
            square.textContent = pieces[piece];
          }

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            square.classList.add('selected');
          }

          // Use touchstart and click to ensure instant response on iOS
          square.addEventListener('click', () => handleSquareTap(r, c));
          boardElement.appendChild(square);
        }
      }
    }

    function handleSquareTap(r, c) {
      const piece = gameState[r][c];

      // If a square is already selected, attempt to move
      if (selectedSquare) {
        if (selectedSquare.r === r && selectedSquare.c === c) {
          // Tap selected square again to deselect
          selectedSquare = null;
          renderBoard();
          return;
        }

        const currentPiece = gameState[selectedSquare.r][selectedSquare.c];

        // Ensure you don't take your own piece
        if ((turn === 'white' && isWhite(piece)) || (turn === 'black' && isBlack(piece))) {
          // Switch selection to new piece
          selectedSquare = { r, c };
          renderBoard();
          return;
        }

        // Execute move
        gameState[r][c] = currentPiece;
        gameState[selectedSquare.r][selectedSquare.c] = '';
        selectedSquare = null;

        // Switch turn
        turn = turn === 'white' ? 'black' : 'white';
        statusElement.textContent = `Turn: ${turn.charAt(0).toUpperCase() + turn.slice(1)}`;

        renderBoard();
        return;
      }

      // First Tap: Select piece belonging to current turn
      if (piece) {
        if ((turn === 'white' && isWhite(piece)) || (turn === 'black' && isBlack(piece))) {
          selectedSquare = { r, c };
          renderBoard();
        }
      }
    }

    function resetGame() {
      initGame();
    }

    // Start game on page load
    initGame();
  </script>
</body>
</html>
