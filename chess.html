<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkmate, My Bae 👑♟️</title>

    <!-- Chessboard CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #3e2723, #394831);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game {
            width: 100%;
            max-width: 480px;
            background: #2b1d19;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
            color: #d7ccc8;
        }

        #board {
            width: 100%;
            margin: 15px 0;
            border-radius: 8px;
            overflow: hidden;
        }

        .status {
            margin: 10px 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .btn {
            background: #5d4037;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #4e342e;
        }
    </style>
</head>
<body>

<div class="game">
    <h1>Checkmate, My Bae 👑♟️</h1>
    <div id="board"></div>
    <div class="status" id="status">Your turn (White)</div>
    <button class="btn" onclick="resetGame()">New Game</button>
</div>

<!-- Dependencies: jQuery, Chessboard.js, and Chess.js -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script>
    let board = null;
    let game = new Chess();
    const $status = $('#status');

    // Piece evaluations for minimax logic
    const weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function evaluateBoard(boardState) {
        let totalEvaluation = 0;
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const piece = boardState[i][j];
                if (piece) {
                    const val = weights[piece.type] || 0;
                    totalEvaluation += piece.color === 'w' ? -val : val;
                }
            }
        }
        return totalEvaluation;
    }

    function makeAiMove() {
        const moves = game.moves({ verbose: true });
        if (moves.length === 0) return;

        let selectedMove;

        // 65% chance for AI to play optimally (65% chance for player to lose)
        // 35% chance AI makes a random suboptimal move
        const playOptimal = Math.random() < 0.65;

        if (playOptimal) {
            let bestMove = null;
            let bestValue = -Infinity;

            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                let boardValue = evaluateBoard(game.board());
                game.undo();
                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = moves[i];
                }
            }
            selectedMove = bestMove || moves[Math.floor(Math.random() * moves.length)];
        } else {
            selectedMove = moves[Math.floor(Math.random() * moves.length)];
        }

        game.move(selectedMove);
        board.position(game.fen());
        updateStatus();
    }

    function onDragStart(source, piece) {
        if (game.game_over()) return false;
        // Only allow player to move white pieces
        if (piece.search(/^b/) !== -1) return false;
    }

    function onDrop(source, target) {
        // Standard chess move attempt via chess.js
        const move = game.move({
            from: source,
            to: target,
            promotion: 'q'
        });

        if (move === null) return 'snapback';

        updateStatus();

        if (!game.game_over()) {
            window.setTimeout(makeAiMove, 250);
        }
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function updateStatus() {
        let statusText = '';

        if (game.in_checkmate()) {
            statusText = game.turn() === 'w' ? 'Game Over: Black wins by Checkmate!' : 'Game Over: You win by Checkmate!';
        } else if (game.in_draw()) {
            statusText = 'Game Over: Draw!';
        } else {
            statusText = game.turn() === 'w' ? 'Your turn (White)' : "AI's turn (Black)...";
            if (game.in_check()) {
                statusText += ' - Check!';
            }
        }

        $status.html(statusText);
    }

    function resetGame() {
        game.reset();
        board.start();
        updateStatus();
    }

    const config = {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    };

    board = Chessboard('board', config);
    updateStatus();
</script>

</body>
</html>
