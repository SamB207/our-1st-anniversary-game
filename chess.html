<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Love Chess - Play vs. Cupid</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ffe6ea 0%, #fbd3e9 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h2 {
      margin: 0 0 5px 0;
      color: #d6336c;
      font-size: 1.8rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #a61e4d;
      margin-bottom: 12px;
    }

    #status {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: #a61e4d;
      text-align: center;
    }

    /* Romantic Board Styling */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      border: 4px solid #d6336c;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(214, 51, 108, 0.25);
      touch-action: manipulation;
      overflow: hidden;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(10vw, 42px);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    /* Soft Pink Board Colors */
    .light {
      background-color: #fff0f3;
    }

    .dark {
      background-color: #f7aef8;
    }

    /* Selected & Highlight States */
    .selected {
      background-color: #ff85a1 !important;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(45deg, #ff4d6d, #d6336c);
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(214, 51, 108, 0.3);
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    /* Love Message Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 3px solid #ff4d6d;
    }

    .modal-content h3 {
      color: #d6336c;
      margin-top: 0;
    }

    .modal-content p {
      color: #495057;
      font-size: 1rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h2>💖 Love Chess 💖</h2>
  <div class="subtitle">You (White) vs. Cupid AI (Black)</div>
  <div id="status">Your turn, sweetheart! ✨</div>
  <div id="board"></div>
  <button onclick="resetGame()">Start New Game 💕</button>

  <!-- Winner / Loser Popup -->
  <div id="loveModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle"></h3>
      <p id="modalMessage"></p>
      <button onclick="closeModal()">Play Again 💌</button>
    </div>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    const modal = document.getElementById('loveModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');

    const pieces = {
      'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
      'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
    };

    const initialBoard = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    let gameState = [];
    let selectedSquare = null;
    let turn = 'white'; // 'white' = Player, 'black' = Cupid AI
    let gameOver = false;

    function isWhite(piece) { return piece && piece === piece.toUpperCase(); }
    function isBlack(piece) { return piece && piece === piece.toLowerCase(); }

    function initGame() {
      gameState = JSON.parse(JSON.stringify(initialBoard));
      turn = 'white';
      selectedSquare = null;
      gameOver = false;
      statusElement.textContent = "Your turn, sweetheart! ✨";
      renderBoard();
    }

    function renderBoard() {
      boardElement.innerHTML = '';
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const square = document.createElement('div');
          square.classList.add('square');
          square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
          square.dataset.row = r;
          square.dataset.col = c;

          const piece = gameState[r][c];
          if (piece) square.textContent = pieces[piece];

          if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
            square.classList.add('selected');
          }

          square.addEventListener('click', () => handleSquareTap(r, c));
          boardElement.appendChild(square);
        }
      }
    }

    function handleSquareTap(r, c) {
      if (gameOver || turn !== 'white') return;

      const piece = gameState[r][c];

      if (selectedSquare) {
        if (selectedSquare.r === r && selectedSquare.c === c) {
          selectedSquare = null;
          renderBoard();
          return;
        }

        const currentPiece = gameState[selectedSquare.r][selectedSquare.c];

        // Prevent capturing your own pieces
        if (isWhite(piece)) {
          selectedSquare = { r, c };
          renderBoard();
          return;
        }

        // Check if captured King
        if (piece === 'k') {
          executeMove(selectedSquare.r, selectedSquare.c, r, c);
          showLoveMessage(true);
          return;
        }

        // Make Move
        executeMove(selectedSquare.r, selectedSquare.c, r, c);
        selectedSquare = null;
        turn = 'black';
        statusElement.textContent = "Cupid is thinking... 💘";
        renderBoard();

        // Cupid AI Turn
        setTimeout(cupidAIMove, 600);
        return;
      }

      if (piece && isWhite(piece)) {
        selectedSquare = { r, c };
        renderBoard();
      }
    }

    function executeMove(fromR, fromC, toR, toC) {
      gameState[toR][toC] = gameState[fromR][fromC];
      gameState[fromR][fromC] = '';
    }

    // Cupid AI logic
    function cupidAIMove() {
      if (gameOver) return;

      let possibleMoves = [];

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (isBlack(gameState[r][c])) {
            // Find all neighboring or forward spaces for basic AI move
            const moves = [
              { r: r + 1, c: c },
              { r: r + 1, c: c - 1 },
              { r: r + 1, c: c + 1 },
              { r: r, c: c - 1 },
              { r: r, c: c + 1 }
            ];

            moves.forEach(m => {
              if (m.r >= 0 && m.r < 8 && m.c >= 0 && m.c < 8) {
                const target = gameState[m.r][m.c];
                if (!isBlack(target)) {
                  possibleMoves.push({
                    from: { r, c },
                    to: m,
                    capturesKing: target === 'K'
                  });
                }
              }
            });
          }
        }
      }

      if (possibleMoves.length > 0) {
        // Prioritize capturing Player King
        let kingCapture = possibleMoves.find(m => m.capturesKing);
        let move = kingCapture || possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

        if (move.capturesKing) {
          executeMove(move.from.r, move.from.c, move.to.r, move.to.c);
          renderBoard();
          showLoveMessage(false);
          return;
        }

        executeMove(move.from.r, move.from.c, move.to.r, move.to.c);
      }

      turn = 'white';
      statusElement.textContent = "Your turn, sweetheart! ✨";
      renderBoard();
    }

    function showLoveMessage(didWin) {
      gameOver = true;
      if (didWin) {
        modalTitle.textContent = "🎉 You Won My Heart! 💖";
        modalMessage.textContent = "You defeated Cupid! Every move you make captured my heart. I love you so much! 💕";
      } else {
        modalTitle.textContent = "💘 Cupid Got You!";
        modalMessage.textContent = "Cupid won this round, but you'll always be my #1 victory! Try again, my love? 🥰";
      }
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
      initGame();
    }

    function resetGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
