<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Score for Love ⚽💕</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #dff7e8,
            #f2fff6,
            #d7f3e3
        );

    color: #315c43;

    display: flex;

    justify-content: center;
}


.game {

    width: 100%;

    max-width: 500px;

    padding:
        20px 16px
        35px;

    text-align: center;
}


/* =========================
   MENU
========================= */

.menu-button {

    display: inline-block;

    margin-bottom: 8px;

    padding: 9px 17px;

    background: white;

    color: #397a50;

    text-decoration: none;

    border-radius: 20px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(50,100,70,0.12);
}

.menu-button:active {

    transform:
        scale(0.95);

}


/* =========================
   TITLE
========================= */

h1 {

    color: #328052;

    font-size: 31px;

    margin: 8px 0 5px;
}


.subtitle {

    font-size: 14px;

    margin-bottom: 15px;
}


/* =========================
   SCORE
========================= */

.stats {

    display: flex;

    justify-content:
        space-around;

    background: white;

    padding: 11px;

    border-radius: 18px;

    margin-bottom: 15px;

    font-size: 14px;

    font-weight: bold;

    box-shadow:
        0 4px 12px
        rgba(50,100,70,0.08);
}


/* =========================
   GOAL
========================= */

.goal {

    position: relative;

    width: 100%;

    height: 245px;

    background:
        linear-gradient(
            #79c98f,
            #58b675
        );

    border:
        7px solid white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 8px 25px
        rgba(50,100,70,0.18);

    touch-action: none;
}


/* net */

.goal::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0 17px,
            rgba(255,255,255,0.38)
            18px 19px
        ),

        repeating-linear-gradient(
            0deg,
            transparent 0 17px,
            rgba(255,255,255,0.38)
            18px 19px
        );

}


/* =========================
   GOALKEEPER
========================= */

.goalkeeper {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 65px;

    z-index: 5;

    transition:
        left 0.25s ease,
        top 0.25s ease;

}


/* =========================
   BALL
========================= */

.ball {

    position: absolute;

    left: 50%;

    bottom: 15px;

    transform:
        translateX(-50%);

    font-size: 43px;

    z-index: 6;

    transition:
        left 0.45s ease,
        bottom 0.45s ease,
        transform 0.45s ease;

}


/* =========================
   MESSAGE
========================= */

#message {

    min-height: 45px;

    margin: 15px 5px;

    font-size: 14px;

    font-weight: bold;

    line-height: 1.5;

}


/* =========================
   SHOT BUTTONS
========================= */

.shots {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;

    margin-top: 12px;
}


.shot {

    border: none;

    border-radius: 18px;

    background: white;

    color: #397a50;

    padding: 14px 4px;

    font-size: 15px;

    font-weight: bold;

    box-shadow:
        0 5px 12px
        rgba(50,100,70,0.12);
}


.shot:active {

    transform:
        scale(0.94);

}


.shot small {

    display: block;

    margin-top: 4px;

    color: #7d9d87;

    font-size: 10px;

    font-weight: normal;

}


/* =========================
   RESULT
========================= */

#result {

    display: none;

    background: white;

    border-radius: 25px;

    padding: 25px 18px;

    margin-top: 20px;

    box-shadow:
        0 10px 30px
        rgba(50,100,70,0.15);
}


.resultEmoji {

    font-size: 60px;

}


.resultTitle {

    color: #328052;

    font-size: 28px;

}


.resultMessage {

    font-size: 15px;

    line-height: 1.7;

}


.restart {

    margin-top: 10px;

    padding: 13px 23px;

    border: none;

    border-radius: 22px;

    background: #4b9b65;

    color: white;

    font-size: 15px;

    font-weight: bold;
}


.restart:active {

    transform:
        scale(0.95);

}


/* =========================
   ANIMATION
========================= */

@keyframes kick {

    0% {

        transform:
            translateX(-50%)
            scale(1);

    }

    50% {

        transform:
            translateX(-50%)
            scale(1.3);

    }

    100% {

        transform:
            translateX(-50%)
            scale(1);

    }

}

.kick {

    animation:
        kick 0.45s ease;

}

</style>

</head>


<body>


<div class="game">


<!-- MENU -->

<a
    href="index.html"
    class="menu-button">

    🏠 Back to Menu

</a>


<h1>

    ⚽ Score for Love 💕

</h1>


<div class="subtitle">

    You need <strong>2 goals</strong>
    to win! 😈

</div>


<!-- SCORE -->

<div class="stats">

    <div>

        🎯 Shots:
        <span id="tries">
            3
        </span>

    </div>


    <div>

        ⚽ Goals:
        <span id="goals">
            0
        </span>

    </div>

</div>


<!-- GOAL -->

<div class="goal">

    <div
        class="goalkeeper"
        id="goalkeeper">

        🧤

    </div>


    <div
        class="ball"
        id="ball">

        ⚽

    </div>

</div>


<div id="message">

    Pick a spot and shoot! 😈⚽

</div>


<!-- SHOTS -->

<div class="shots">


    <button
        class="shot"
        onclick="shoot('left')">

        ⬅️ Left

        <small>
            Safer
        </small>

    </button>


    <button
        class="shot"
        onclick="shoot('center')">

        ⬆️ Center

        <small>
            Balanced
        </small>

    </button>


    <button
        class="shot"
        onclick="shoot('right')">

        ➡️ Right

        <small>
            Safer
        </small>

    </button>

</div>


<!-- RESULT -->

<div id="result">

    <div
        class="resultEmoji"
        id="resultEmoji">
    </div>


    <h2
        class="resultTitle"
        id="resultTitle">
    </h2>


    <p
        class="resultMessage"
        id="resultMessage">
    </p>


    <button
        class="restart"
        onclick="restartGame()">

        🔄 Play Again

    </button>

</div>


</div>


<script>


/* =========================
   GAME VARIABLES
========================= */

let tries = 3;

let goals = 0;

let gameOver = false;

let shooting = false;


/* =========================
   ELEMENTS
========================= */

const goalkeeper =
    document.getElementById(
        "goalkeeper"
    );

const ball =
    document.getElementById(
        "ball"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================
   RANDOM
========================= */

function random(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}


/* =========================
   SHOOT
========================= */

function shoot(direction) {

    if (
        gameOver ||
        shooting ||
        tries <= 0
    ) return;


    shooting = true;


    /*
       Reduce try
    */

    tries--;


    document.getElementById(
        "tries"
    ).textContent =
        tries;


    /*
       Goalkeeper AI
    */

    const positions = [

        "left",

        "center",

        "right"

    ];


    /*
       15% chance goalkeeper
       waits in center
    */

    let keeperPosition;


    if (
        Math.random() < 0.15
    ) {

        keeperPosition =
            "center";

    }

    else {

        keeperPosition =
            positions[
                random(
                    0,
                    2
                )
            ];

    }


    /*
       Move goalkeeper
    */

    if (
        keeperPosition === "left"
    ) {

        goalkeeper.style.left =
            "20%";

        goalkeeper.style.top =
            "58%";

    }

    else if (
        keeperPosition === "right"
    ) {

        goalkeeper.style.left =
            "80%";

        goalkeeper.style.top =
            "58%";

    }

    else {

        goalkeeper.style.left =
            "50%";

        goalkeeper.style.top =
            "50%";

    }


    /*
       Move ball
    */

    if (
        direction === "left"
    ) {

        ball.style.left =
            "20%";

        ball.style.bottom =
            "145px";

    }

    else if (
        direction === "right"
    ) {

        ball.style.left =
            "80%";

        ball.style.bottom =
            "145px";

    }

    else {

        ball.style.left =
            "50%";

        ball.style.bottom =
            "165px";

    }


    ball.classList.remove(
        "kick"
    );


    void ball.offsetWidth;


    ball.classList.add(
        "kick"
    );


    /*
       Determine outcome
    */

    setTimeout(
        function() {

            resolveShot(
                direction,
                keeperPosition
            );

        },
        500
    );

}


/* =========================
   RESOLVE SHOT
========================= */

function resolveShot(
    direction,
    keeperPosition
) {


    /*
       Base chance of scoring.

       The center is slightly harder.
    */

    let goalChance;


    if (
        direction === "center"
    ) {

        goalChance = 0.68;

    }

    else {

        goalChance = 0.72;

    }


    /*
       Goalkeeper guessed
       correctly.

       Much harder.
    */

    if (
        direction ===
        keeperPosition
    ) {

        goalChance = 0.12;

    }


    /*
       Small chance of completely
       missing the goal.
    */

    if (
        Math.random() >
        goalChance
    ) {

        /*
           Decide whether it was
           blocked or missed.
        */

        if (
            direction ===
            keeperPosition
        ) {

            message.textContent =
                "🧤 SAVED! The goalkeeper "
                +
                "read your shot! 😭";

        }

        else {

            message.textContent =
                "😭 So close! The shot "
                +
                "missed the goal!";

        }

    }

    else {

        goals++;


        document.getElementById(
            "goals"
        ).textContent =
            goals;


        message.textContent =
            "⚽ GOOOOOAL! ❤️🔥";


        if (
            navigator.vibrate
        ) {

            navigator.vibrate(
                [60, 40, 60]
            );

        }

    }


    /*
       Check if player already
       reached 2 goals.
    */

    if (
        goals >= 2
    ) {

        setTimeout(
            finishGame,
            700
        );

        return;

    }


    /*
       Check remaining shots
    */

    if (
        tries <= 0
    ) {

        setTimeout(
            finishGame,
            700
        );

        return;

    }


    /*
       Reset ball
    */

    setTimeout(
        function() {

            ball.style.left =
                "50%";

            ball.style.bottom =
                "15px";

            goalkeeper.style.left =
                "50%";

            goalkeeper.style.top =
                "50%";

            shooting = false;

        },
        700
    );

}


/* =========================
   FINISH
========================= */

function finishGame() {

    gameOver = true;

    shooting = false;


    document.getElementById(
        "result"
    ).style.display =
        "block";


    /*
       WIN
    */

    if (
        goals >= 2
    ) {

        document.getElementById(
            "resultEmoji"
        ).textContent =
            "🏆⚽❤️";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "YOU WON!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "YOU DID IT! 😭💕 "
            +
            "You scored "
            +
            goals +
            " goals out of 3! "
            +
            "Looks like you know exactly "
            +
            "how to score your way into my heart. "
            +
            "❤️ Happy Anniversary, my love!";

    }


    /*
       LOSE
    */

    else {

        document.getElementById(
            "resultEmoji"
        ).textContent =
            "😭⚽💔";


        document.getElementById(
            "resultTitle"
        ).textContent =
            "YOU LOST!";


        document.getElementById(
            "resultMessage"
        ).textContent =
            "Awww... only "
            +
            goals +
            " goal"
            +
            (goals === 1 ? "" : "s")
            +
            " out of 3! 😭 "
            +
            "The goalkeeper was NOT "
            +
            "letting you win today. 😂💕 "
            +
            "But don't worry, you still "
            +
            "have my heart. ❤️";

    }


    document.getElementById(
        "result"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   RESTART
========================= */

function restartGame() {

    tries = 3;

    goals = 0;

    gameOver = false;

    shooting = false;


    document.getElementById(
        "tries"
    ).textContent =
        "3";


    document.getElementById(
        "goals"
    ).textContent =
        "0";


    document.getElementById(
        "result"
    ).style.display =
        "none";


    message.textContent =
        "Pick a spot and shoot! 😈⚽";


    ball.style.left =
        "50%";


    ball.style.bottom =
        "15px";


    goalkeeper.style.left =
        "50%";


    goalkeeper.style.top =
        "50%";

}

</script>

</body>

</html>
